<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Do Lixo &agrave; Luz">
<meta property="og:description" content="Jornada gamificada sobre res&iacute;duos s&oacute;lidos, convers&atilde;o energ&eacute;tica e fluidodin&acirc;mica computacional (PICJr 2026, UNIVC).">

<body><title>Do Lixo à Luz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jornada gamificada sobre resíduos sólidos, conversão energética e fluidodinâmica computacional (PIC-Jr 2026).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: trilha de jogo vertical — barra superior com XP, coluna de até 1080px, fases como paradas numeradas de uma trilha */
:root{
  --bg:#EAF5EF; --surface:#FFFFFF; --surface-2:#DCEEE4; --ink:#11302A; --muted:#536D66; --line:#C6DDD1;
  --brand:#0A9A68; --brand-deep:#067A52; --on-brand:#FFFFFF;
  --sun:#FFB01F; --sun-deep:#D08600; --on-sun:#2A1C00;
  --flame:#EE5330; --sky:#2A7BDE; --violet:#7B3FB5;
  --good:#0E9A4A; --bad:#D83A42; --good-bg:#DBF5E5; --bad-bg:#FDE4E4;
  --bin-azul:#1F5FD1; --bin-vermelho:#D63434; --bin-verde:#1C9646; --bin-amarelo:#F2B705; --bin-marrom:#8A5A2B;
  --bin-preto:#2A2A2A; --bin-laranja:#EF7A12; --bin-cinza:#7A878C; --bin-branco:#EDEDED; --bin-roxo:#7B3FB5;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B18; --surface:#142824; --surface-2:#1B352F; --ink:#E5F4EE; --muted:#97B2AA; --line:#2A4740;
    --brand:#22C38A; --brand-deep:#11905E; --on-brand:#04251A;
    --sun:#FFC247; --sun-deep:#B87D00; --on-sun:#2A1C00;
    --flame:#FF7553; --sky:#62A7F6; --violet:#B48AE6;
    --good:#43D282; --bad:#FF6F74; --good-bg:#153A2A; --bad-bg:#3F1D21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B18; --surface:#142824; --surface-2:#1B352F; --ink:#E5F4EE; --muted:#97B2AA; --line:#2A4740;
  --brand:#22C38A; --brand-deep:#11905E; --on-brand:#04251A;
  --sun:#FFC247; --sun-deep:#B87D00; --on-sun:#2A1C00;
  --flame:#FF7553; --sky:#62A7F6; --violet:#B48AE6;
  --good:#43D282; --bad:#FF6F74; --good-bg:#153A2A; --bad-bg:#3F1D21;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-weight:900;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Botões de jogo */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-family:var(--font-display);font-size:1.05rem;letter-spacing:.02em;padding:.75em 1.3em;border-radius:14px;border:0;cursor:pointer;background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--sun-deep)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.small{font-size:.9rem;padding:.5em .9em;border-radius:11px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.logo span{font-family:var(--font-display);font-size:1.35rem;color:var(--ink)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
.nav button{background:none;border:0;padding:8px 12px;border-radius:10px;font-weight:800;cursor:pointer;color:var(--muted)}
.nav button[aria-current="page"],.nav button:hover{background:var(--surface-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--sun);flex:none}
.ava.big{width:64px;height:64px;font-size:2.2rem}

/* Login */
.login{min-height:calc(100vh - 220px);display:grid;align-items:center;padding-block:32px}
.login-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero-title{font-size:clamp(2.8rem,7vw,5.2rem);line-height:.95;color:var(--ink)}
.hero-title em{font-style:normal;color:var(--brand);display:block}
.hero-title b{font-weight:400;color:var(--sun-deep)}
.bins-strip{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.bins-strip i{width:38px;height:50px;border-radius:6px 6px 10px 10px;position:relative;display:block;animation:bob 2.8s ease-in-out infinite}
.bins-strip i::before{content:"";position:absolute;left:-3px;right:-3px;top:-8px;height:8px;border-radius:5px;background:inherit;filter:brightness(.8)}
@keyframes bob{50%{transform:translateY(-6px)}}
.lead{font-size:1.15rem;max-width:34ch;margin-top:16px;color:var(--muted)}
form .field{display:grid;gap:6px;margin-bottom:14px}
label.lbl{font-weight:800;font-size:.92rem}
input[type=text],input[type=password],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:.7em .9em;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.ava-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.ava-pick button{aspect-ratio:1;max-width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.5rem;cursor:pointer;display:grid;place-items:center}
.ava-pick button[aria-pressed="true"]{border-color:var(--brand);background:var(--good-bg);transform:scale(1.06)}
.err{color:var(--bad);font-weight:700;font-size:.9rem;min-height:1.3em}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick button{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;cursor:pointer}
.quick button .ava{width:28px;height:28px;font-size:1rem}

/* Hub */
.hub{padding-block:24px 48px;display:grid;gap:24px}
.hello{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.xpbar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--flame));border-radius:999px;transition:width .6s}
.hub-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.trail{position:relative;display:grid;gap:18px;padding-left:0}
.trail::before{content:"";position:absolute;left:35px;top:30px;bottom:30px;border-left:4px dashed var(--line)}
.stop{position:relative;display:grid;grid-template-columns:74px 1fr;gap:16px;align-items:center}
.stop .num{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:2rem;color:#fff;background:var(--pc);box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 65%,#000);position:relative;z-index:1}
.stop .card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px 18px}
.phase-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:16px}
.phase-nav .btn{max-width:100%;white-space:normal;text-align:left}
.phase-nav .next{margin-left:auto;text-align:right}
.stop h3{font-size:1.35rem}
.stars{color:var(--sun-deep);letter-spacing:2px;font-size:1.1rem;white-space:nowrap}
.stars .off{color:var(--line)}
.side{display:grid;gap:16px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--surface-2);font-size:.72rem;font-weight:800;line-height:1.2}
.badge b{font-size:1.6rem;line-height:1.2;font-weight:400}
.badge.off{opacity:.35;filter:grayscale(1)}
.rank{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:22px 28px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px}
.rank li.me{background:var(--good-bg)}
.rank .ava{width:28px;height:28px;font-size:1rem}
.watt{display:flex;gap:12px;align-items:flex-start}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;font-weight:600}
.bubble::before{content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* Fase */
.phase{padding-block:20px 56px;display:grid;gap:18px}
.phase-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phase-head .num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;color:#fff;background:var(--pc);box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 65%,#000)}
.phase-head h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:900;cursor:pointer;color:var(--muted);border-radius:12px 12px 0 0;margin-bottom:-2px;border-bottom:4px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pc)}
.learn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.learn .card h3{font-size:1.3rem;margin-bottom:8px;color:var(--ink)}
.learn .card p+p,.learn .card p+ul,.learn .card ul+p{margin-top:8px}
.learn ul{margin:6px 0 0;padding-left:1.2em}
.learn li+li{margin-top:4px}
.learn .wide{grid-column:1/-1}
.bigfact{font-family:var(--font-display);font-size:2.4rem;color:var(--pc);line-height:1}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.binpal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.binpal div{border-radius:10px;padding:10px 6px;text-align:center;font-weight:800;font-size:.8rem;color:#fff}
.layers{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:10px;font-weight:900;font-size:.8rem}
.layers span{display:grid;place-items:center;color:#fff}
.hier{display:grid;gap:6px;margin-top:10px;counter-reset:h}
.hier div{padding:8px 12px;border-radius:10px;background:var(--surface-2);font-weight:800}
.hier div:nth-child(5){outline:3px solid var(--sun)}
.learn-cta{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* Quiz */
.quiz{display:grid;gap:16px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-weight:900}
.prog{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pc);transition:width .4s}
.qcard{text-align:center;display:grid;gap:8px;justify-items:center;padding:24px 18px}
.qitem{font-size:4.2rem;line-height:1;animation:pop .35s ease-out}
.qname{font-family:var(--font-display);font-size:1.7rem}
.prompt{font-weight:800;color:var(--muted);font-size:1.05rem}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.opts{display:grid;gap:12px}
.opts-cat{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts-bin{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts-duel{grid-template-columns:1fr auto 1fr;align-items:stretch}
.opts-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:grid;gap:2px;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:hover:not([disabled]){border-color:var(--pc)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt[disabled]{cursor:default}
.opt small{font-weight:600;color:var(--muted)}
.opt.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt-cat{grid-template-columns:auto 1fr;align-items:center;gap:12px;color:var(--ink)}
.opt-cat .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:var(--c)}
.opt-bin{background:var(--c);border:0;color:#fff;text-align:center;justify-items:center;padding:22px 8px 14px;border-radius:8px 8px 16px 16px;position:relative;margin-top:10px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.opt-bin::before{content:"";position:absolute;left:-5px;right:-5px;top:-10px;height:12px;border-radius:6px;background:var(--c);filter:brightness(.82)}
.opt-bin.dark-text{color:#2A1C00}
.opt-bin .ic{font-size:1.4rem}
.opt-bin.ok{outline:4px solid var(--good);outline-offset:3px;background:var(--c);box-shadow:0 4px 0 var(--good)}
.opt-bin.no{outline:4px solid var(--bad);outline-offset:3px;background:var(--c);box-shadow:0 4px 0 var(--bad)}
.opt-duel{justify-items:center;text-align:center;padding:22px 12px;font-size:1.1rem}
.opt-duel .ic{font-size:3.4rem;line-height:1.1}
.opt-duel .val{font-family:var(--font-mono);font-size:1.1rem;margin-top:6px}
.meter{width:100%;height:10px;border-radius:999px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--flame))}
.vs{align-self:center;font-family:var(--font-display);font-size:1.6rem;color:var(--flame)}
.fb{border-radius:16px;padding:16px 18px;display:grid;gap:8px;border:2px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:1.3rem}
.fb .row{display:flex;justify-content:flex-end}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding:32px 20px}
.result .stars{font-size:3rem;letter-spacing:6px}
.result h2{font-size:2.2rem}
.newbadge{display:inline-flex;gap:10px;align-items:center;background:var(--surface-2);padding:10px 16px;border-radius:14px;font-weight:800}
.newbadge b{font-size:2rem;font-weight:400}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.slider{display:grid;gap:4px;margin-bottom:16px}
.slider .top-row{display:flex;justify-content:space-between;gap:8px;font-weight:800}
input[type=range]{width:100%;accent-color:var(--pc,var(--brand))}
.outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.out{background:var(--surface-2);border-radius:14px;padding:12px}
.out .v{font-family:var(--font-display);font-size:1.7rem;line-height:1.1}
.out .u{font-size:.85rem;color:var(--muted);font-weight:700}
.bars{display:grid;gap:8px;margin-top:12px}
.bars div{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.85rem;font-weight:800}
.bars span.b{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bars span.b i{display:block;height:100%;border-radius:999px}
.eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.eq div{text-align:center;padding:10px 6px;border-radius:14px;border:2px dashed var(--line);font-weight:800;font-size:.85rem}
.eq b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.note{font-size:.82rem;color:var(--muted)}

/* Simuladores */
.sim{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.simcanvas{background:#0B1E2E;border-radius:16px;display:block;max-width:100%;border:2px solid var(--line)}
.regime{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:900;color:#fff;background:var(--rc,#666)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px}
.kv small{display:block;font-weight:800;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--font-mono);font-size:1.05rem}
.missions{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.missions li{display:flex;gap:10px;align-items:center;font-weight:700;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.missions li.done{background:var(--good-bg)}
.missions li i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none;font-size:.85rem}
.missions li.done i{background:var(--good);border-color:var(--good);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pc,var(--brand));border-color:var(--pc,var(--brand));color:#fff}
.cfdbox{display:grid;gap:12px}
.cfd-wrap{position:relative;max-width:100%}
.cfd-wrap canvas{width:100%;height:auto;aspect-ratio:2/1;touch-action:none;cursor:crosshair}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:.9rem}
.steps li::before{content:counter(st);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;font-family:var(--font-display);margin-right:6px}
.steps b{display:inline}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-weight:800}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* Professor */
.teacher{padding-block:24px 56px;display:grid;gap:18px}
.hub,.phase,.teacher,.about{grid-template-columns:minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--font-display);font-size:2rem;font-weight:400;line-height:1.1}
.stat span{font-weight:800;color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-weight:800;font-size:.9rem;margin-top:8px}
.pbar span.b{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pbar span.b i{display:block;height:100%;border-radius:999px}
.switch{display:flex;gap:10px;align-items:center;font-weight:800;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
textarea{min-height:110px;font-family:var(--font-mono);font-size:.8rem}

/* Sobre / certificado */
.about{padding-block:24px 56px;display:grid;gap:18px}
.about .two .card h3{font-size:1.3rem;margin-bottom:8px}
.about ul,.about ol{margin:6px 0 0;padding-left:1.2em}
.about li+li{margin-top:4px}
.cert{max-width:760px;margin:24px auto;text-align:center;padding:40px 28px;border:6px double var(--brand);border-radius:24px;background:var(--surface);display:grid;gap:12px;justify-items:center}
.cert h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--brand)}
.cert .who{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.4rem)}

/* Rodapé com as instituições: faixa branca nos dois temas, porque os logos têm fundo transparente e cores escuras */
.sponsors{border-top:2px solid var(--line);background:var(--surface)}
.sponsors .wrap{padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;text-align:center}
.logos{background:#FFFFFF;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 28px;padding:8px 16px;max-width:100%}
.logos img{display:block;width:auto;height:auto;max-width:100%;max-height:26px}
.sponsors:not(.big) .logos{opacity:.85}
.sponsors .note{font-size:.75rem}
.sponsors.big .wrap{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));gap:12px}
.sponsors.big .logos{gap:20px 56px;padding:20px 32px;border-radius:18px;border:2px solid var(--line)}
.sponsors.big .logos img{max-height:68px}
.sponsors.big .logos img.wide{max-height:62px}
/* logos em pé (UFES, PPGEN) precisam de mais altura para ter o mesmo peso visual dos horizontais */
.logos img.tall{max-height:40px}
.sponsors.big .logos img.tall{max-height:92px}
@media (max-width:560px){ .sponsors.big .logos img{max-height:52px} .sponsors.big .logos img.tall{max-height:72px} .sponsors.big .logos img.wide{max-height:none} .logos img{max-height:22px} .logos img.tall{max-height:34px} }
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

@media (max-width:860px){
  .login-grid,.hub-grid,.calc,.sim,.two{grid-template-columns:minmax(0,1fr)}
  .learn{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .opts-cat,.opts-list{grid-template-columns:1fr}
  .opts-bin{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts-duel{grid-template-columns:1fr}
  .vs{justify-self:center}
  .hello{grid-template-columns:auto 1fr}
  .hello .btn{grid-column:1/-1}
  .stop{grid-template-columns:54px 1fr;gap:10px}
  .stop .num{width:54px;height:54px;font-size:1.5rem}
  .trail::before{left:25px}
  .stop .card{grid-template-columns:1fr}
  .ava-pick{grid-template-columns:repeat(4,1fr)}
  .binpal{grid-template-columns:repeat(2,1fr)}
  .kv,.eq,.steps{grid-template-columns:1fr 1fr}
  .outs{grid-template-columns:1fr}
  .bars div{grid-template-columns:90px 1fr 60px}
  .pbar{grid-template-columns:100px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

  if(!store.sound) return;

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();

  let f = 0;
  (function tick(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);

function levelOf(xp){ let i = 0; LEVELS.forEach((l, k) => { if(xp >= l[0]) i = k; }); const next = LEVELS[i + 1]; return {i, name:LEVELS[i][1], base:LEVELS[i][0], next: next ? next[0] : null}; }

const SHEETS_URL_PADRAO = 'https://script.google.com/macros/s/AKfycbxSvoyIGJVZ9JexVcOHrL7qkFLl5BvpC_jkqkdx70ojbV2nnliuHJsE0TK_uXq31ppEfQ/exec';
let flushing = false;
function sheetsUrl(){ return String(store.sheetsUrl || SHEETS_URL_PADRAO || '').trim(); }
function cleanUser(u){ return {id:u.id, name:u.name, turma:u.turma, avatar:u.avatar, phases:u.phases || {}, missions:u.missions || {}, seen:u.seen || {}, errors:u.errors || {}, created:u.created || 0, last:u.last || 0}; }
async function postSheets(body){
  const url = sheetsUrl(); if(!url) throw new Error('Planilha não configurada.');
  // sem cabeçalho Content-Type o navegador envia text/plain e o Apps Script aceita sem pré-verificação CORS
  const r = await fetch(url, {method:'POST', body:JSON.stringify(body), redirect:'follow'});
  if(!r.ok) throw new Error('A planilha respondeu com erro ' + r.status + '.');
  return r.json();
}
function markDirty(u, fase){
  if(!u || !sheetsUrl()) return;
  store.outbox = store.outbox || {};
  const o = store.outbox[u.id] || (store.outbox[u.id] = {fases:[]});
  if(fase) o.fases.push(fase);
  o.v = (o.v || 0) + 1;
  save(); flushSheets();
}
function pendingCount(){ return Object.keys(store.outbox || {}).length; }
async function flushSheets(){
  if(flushing || !sheetsUrl() || !pendingCount()) return;
  flushing = true;
  try{
    for(const id of Object.keys(store.outbox)){
      const u = store.users[id], o = store.outbox[id];
      if(!u){ delete store.outbox[id]; continue; }
      const sent = o.fases.length, v = o.v;
      const j = await postSheets({acao:'salvar', aluno:cleanUser(u), fases:o.fases.slice(0, sent)});
      if(!j.ok) throw new Error(j.erro || 'erro');
      o.fases.splice(0, sent);
      // só sai da fila se nada mudou durante o envio
      if(o.v === v && store.outbox[id] === o) delete store.outbox[id];
      save();
    }
    store.sheetsOk = Date.now(); store.sheetsErr = null; save();
    if(pendingCount()) setTimeout(flushSheets, 500);
  }catch(e){ store.sheetsErr = String(e.message || e); save(); }
  finally{ flushing = false; updateSheetsStatus(); }
}

function startRun(pid){ run = {pid, qs:PHASES[pid - 1].build(), i:0, correct:0, picked:null, result:null}; }

function viewQuiz(p){
  if(!run || run.pid !== p.id) startRun(p.id);
  if(run.result) return viewResult(p);
  const q = run.qs[run.i]; const n = run.qs.length; const ans = run.picked;
  const cls = o => ans == null ? '' : o.id === q.answer ? 'ok' : o.id === ans ? 'no' : 'dim';
  let opts = '';
  if(q.style === 'cat') opts = q.options.map(o => `<button class="opt opt-cat ${cls(o)}" style="--c:${o.c}" data-act="answer" data-arg="${o.id}" ${ans != null ? 'disabled' : ''}><span class="ic">${o.e}</span><span>${o.label}<br><small>${o.sub}</small></span></button>`).join('');
  else if(q.style === 'bin') opts = q.options.map(o => `<button class="opt opt-bin ${o.dark ? 'dark-text' : ''} ${cls(o)}" style="--c:${o.c}" data-act="answer" data-arg="${o.id}" ${ans != null ? 'disabled' : ''} aria-label="Lixeira ${o.label}: ${o.sub}"><span class="ic">${o.e}</span><span>${o.label}</span><small style="color:inherit;opacity:.9">${o.sub}</small></button>`).join('');
  else if(q.style === 'duel'){
    const max = 43;
    const card = o => `<button class="opt opt-duel ${cls(o)}" data-act="answer" data-arg="${o.id}" ${ans != null ? 'disabled' : ''}><span class="ic">${o.e}</span><span>${o.label}</span>${ans != null ? `<span class="val">${fmt(o.v)} MJ/kg</span><span class="meter"><i style="width:${o.v / max * 100}%"></i></span>` : '<small>toque para escolher</small>'}</button>`;
    opts = card(q.options[0]) + '<span class="vs">VS</span>' + card(q.options[1]);
  }
  else opts = q.options.map(o => `<button class="opt ${cls(o)}" data-act="answer" data-arg="${o.id}" ${ans != null ? 'disabled' : ''}><span>${o.label}</span>${o.sub ? `<small>${o.sub}</small>` : ''}</button>`).join('');
  const right = q.options.find(o => o.id === q.answer);
  const ok = ans === q.answer;
  return `<section class="quiz">
    <div class="qhead"><span class="mono">${run.i + 1}/${n}</span><div class="prog"><i style="width:${(run.i + (ans != null ? 1 : 0)) / n * 100}%"></i></div><span class="mono">✔ ${run.correct}</span></div>
    <div class="card qcard">${q.item ? `<div class="qitem" aria-hidden="true">${q.item.e}</div>${q.item.n ? `<div class="qname">${q.item.n}</div>` : ''}` : '<div class="qitem" aria-hidden="true">🔥</div>'}<p class="prompt" style="${q.item && !q.item.n ? 'font-size:1.3rem;color:var(--ink)' : ''}">${q.prompt}</p></div>
    <div class="opts opts-${q.style}">${opts}</div>
    ${ans != null ? `<div class="fb ${ok ? 'ok' : 'no'}" role="status"><h3>${ok ? 'Isso aí! +10 pontos' : 'Quase! Resposta certa: ' + (right.label + (q.style === 'bin' ? ' (' + right.sub + ')' : ''))}</h3><p>${q.why}</p><div class="row"><button class="btn" data-act="next" id="nextBtn">${run.i + 1 < n ? 'Próxima →' : 'Ver resultado'}</button></div></div>` : ''}
  </section>`;
}

function answer(id){
  if(!run || run.picked != null) return;
  const q = run.qs[run.i]; const u = cur();
  run.picked = id;
  const ok = id === q.answer;
  u.seen = u.seen || {}; u.errors = u.errors || {};
  u.seen[q.key] = (u.seen[q.key] || 0) + 1;
  if(ok) run.correct++; else u.errors[q.key] = (u.errors[q.key] || 0) + 1;
  save(); beep(ok ? 'ok' : 'bad');
  render();
  const nb = $('#nextBtn'); if(nb) nb.focus({preventScroll:true});
  const fb = $('.fb'); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth'});
}

function nextQ(){
  if(!run) return;
  if(run.i + 1 < run.qs.length){ run.i++; run.picked = null; render(); window.scrollTo({top:0}); return; }
  const u = cur(); const n = run.qs.length; const ratio = run.correct / n;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1;
  const xp = run.correct * 10 + 30 + (stars === 3 ? 20 : 0);
  const before = xpOf(u); const lvBefore = levelOf(before).i;
  const bBefore = badgesOf(u).filter(b => b.on).map(b => b.n);
  const prev = u.phases[run.pid] || {xp:0, stars:0, best:0, attempts:0};
  u.phases[run.pid] = {xp:Math.max(prev.xp, xp), stars:Math.max(prev.stars, stars), best:Math.max(prev.best || 0, ratio), attempts:(prev.attempts || 0) + 1, last:ratio, at:Date.now()};
  u.last = Date.now(); save();
  markDirty(u, {fase:run.pid, acerto:ratio, estrelas:stars, tentativa:u.phases[run.pid].attempts});
  const after = xpOf(u);
  run.result = {ratio, stars, gained:after - before, levelUp: levelOf(after).i > lvBefore, newBadges: badgesOf(u).filter(b => b.on && !bBefore.includes(b.n))};
  beep('win'); if(stars >= 2) confetti();
  render(); window.scrollTo({top:0});
}

function viewResult(p){
  const r = run.result; const u = cur();
  const msg = r.stars === 3 ? 'Mandou muito bem!' : r.stars === 2 ? 'Muito bom!' : 'Fase concluída!';
  const nextP = PHASES[p.id];
  return `<section class="card result">
    ${WATT}
    <div class="stars">${'★'.repeat(r.stars)}<span class="off">${'★'.repeat(3 - r.stars)}</span></div>
    <h2>${msg}</h2>

const CALC = {org:40, pla:6, tet:3, ole:12};
function viewCalc(){
  const sl = (id, label, min, max, step, unit) => `<div class="slider"><div class="top-row"><label for="c_${id}">${label}</label><span class="mono" id="v_${id}">${fmt(CALC[id])} ${unit}</span></div><input type="range" id="c_${id}" min="${min}" max="${max}" step="${step}" value="${CALC[id]}" data-calc="${id}" data-unit="${unit}"></div>`;
  return `<div class="watt">${WATT}<p class="bubble">Estime o que <b>a sua escola</b> joga fora e veja quanta energia daria para recuperar em um mês (22 dias letivos).</p></div>
  <div class="calc">
    <section class="card"><h3 style="margin-bottom:14px">Resíduos da escola</h3>
      ${sl('org','🍲 Restos orgânicos da cantina', 0, 200, 1, 'kg/dia')}
      ${sl('pla','🛍️ Plástico não reciclável', 0, 50, .5, 'kg/dia')}
      ${sl('tet','🧃 Tetra Pak que não foi reciclada', 0, 30, .5, 'kg/dia')}
      ${sl('ole','🛢️ Óleo de cozinha usado', 0, 100, 1, 'L/mês')}
      <p class="note">Fatores médios usados: 0,1 m³ de biogás por kg de orgânico; biogás com 6 kWh/m³; pirólise com ~0,75 L de óleo por kg de plástico; 20 MJ/kg na Tetra Pak; 0,9 L de biodiesel por L de óleo; eficiência elétrica de 25 a 30%. São estimativas para fins didáticos.</p>
    </section>
    <section class="card" id="calcOut"></section>
  </div>`;
}
function calcUpdate(){
  const D = 22;
  const orgM = CALC.org * D, plaM = CALC.pla * D, tetM = CALC.tet * D;
  const biogas = orgM * 0.1;
  const botij = biogas * 21.5 / (13 * 46);
  const eOrg = biogas * 6 * 0.30;
  const oleoPir = plaM * 0.75;
  const ePla = plaM * 35 / 3.6 * 0.25;
  const syn = tetM * 20 * 0.7 / 3.6;
  const eTet = tetM * 20 / 3.6 * 0.25;
  const biod = CALC.ole * 0.9;
  const eOle = biod * 33 / 3.6 * 0.30;
  const tot = eOrg + ePla + eTet + eOle;
  const parts = [['Biogás', eOrg, 'var(--bin-marrom)'], ['Pirólise', ePla, 'var(--bin-vermelho)'], ['Gaseificação', eTet, 'var(--sky)'], ['Biodiesel', eOle, 'var(--sun-deep)']];
  const mx = Math.max(1, ...parts.map(p => p[1]));
  $('#calcOut').innerHTML = `<h3 style="margin-bottom:12px">Em um mês, daria para obter…</h3>
    <div class="outs">
      <div class="out"><div class="v">${fmt(biogas, 0)} m³</div><div class="u">de biogás, o mesmo que ${fmt(botij, 1)} botijões de 13 kg</div></div>
      <div class="out"><div class="v">${fmt(oleoPir, 0)} L</div><div class="u">de óleo pirolítico</div></div>
      <div class="out"><div class="v">${fmt(syn, 0)} kWh</div><div class="u">de energia no gás de síntese</div></div>
      <div class="out"><div class="v">${fmt(biod, 1)} L</div><div class="u">de biodiesel</div></div>
    </div>
    <p class="eyebrow" style="margin-top:16px">Eletricidade possível: <span class="mono" style="color:var(--ink);font-size:1rem">${fmt(tot, 0)} kWh/mês</span></p>
    <div class="bars">${parts.map(p => `<div><span>${p[0]}</span><span class="b"><i style="width:${p[1] / mx * 100}%;background:${p[2]}"></i></span><span class="mono" style="text-align:right">${fmt(p[1], 0)} kWh</span></div>`).join('')}</div>
    <div class="eq"><div><b>${fmt(tot / 0.015, 0)}</b>cargas de celular</div><div><b>${fmt(tot / 0.73, 0)}</b>banhos de 8 min</div><div><b>${fmt(tot / 1.3, 0)}</b>dias de geladeira</div></div>`;
}

const BEDMAT = {
  tetra:{n:'Tetra Pak picada', rho:1000, c:'#8EC3FF'},
  areia:{n:'Areia', rho:2650, c:'#E9C27A'},
  pe:{n:'Plástico PE picado', rho:950, c:'#FF9DBB'},
  serragem:{n:'Serragem', rho:500, c:'#D29A5C'}
};
const SIM = {mat:'tetra', d:2, s:0, raf:0, cfdRaf:0, paused:false};
const pauseBtn = () => `<button class="btn ghost small" data-act="pause" aria-pressed="${SIM.paused}">${SIM.paused ? '▶ Continuar animação' : '⏸ Pausar animação'}</button>`;
function sliderToU(s){ return 12 * Math.pow(s / 1000, 2); }
function fluidCalc(dmm, rho){
  const g = 9.81, rg = 1.2, mu = 1.8e-5, d = dmm / 1000;
  const Ar = Math.pow(d, 3) * rg * (rho - rg) * g / (mu * mu);
  const Remf = Math.sqrt(33.7 * 33.7 + 0.0408 * Ar) - 33.7;
  const umf = Remf * mu / (rg * d);
  let ut = 1;
  for(let i = 0; i < 100; i++){ const Re = Math.max(rg * ut * d / mu, 1e-6); const Cd = Re < 1000 ? 24 / Re * (1 + 0.15 * Math.pow(Re, 0.687)) : 0.44; const un = Math.sqrt(4 * g * d * (rho - rg) / (3 * Cd * rg)); ut = 0.5 * (ut + un); }
  const dPb = (1 - 0.45) * (rho - rg) * g * 0.3;
  return {umf, ut, dPb, Ar};
}
function regimeOf(u, f){ return u < f.umf ? 'fixo' : u < f.ut ? 'borb' : 'arraste'; }
const REG = {fixo:{n:'Leito fixo', c:'#6B7C85'}, borb:{n:'Fluidização borbulhante', c:'#1C9646'}, arraste:{n:'Arraste (transporte pneumático)', c:'#EE5330'}};

function viewLeito(){
  const u = cur(); const m = u.missions || {};
  return `<div class="watt">${WATT}<p class="bubble">Aumente o ar devagar e acompanhe o leito: primeiro fixo, depois borbulhante, depois arrastado. Os números saem das correlações usadas por engenheiros.</p></div>
  <div class="sim">
    <canvas id="bedCanvas" class="simcanvas" width="320" height="460" aria-label="Animação do leito fluidizado"></canvas>
    <section class="card" style="min-width:0">
      <div class="slider"><div class="top-row"><label for="sU">💨 Velocidade do ar (u)</label><span class="mono" id="uVal">0 m/s</span></div><input type="range" id="sU" min="0" max="1000" step="1" value="${SIM.s}"></div>
      <div class="slider"><div class="top-row"><label for="sD">⚪ Diâmetro da partícula (d)</label><span class="mono" id="dVal">${fmt(SIM.d, 1)} mm</span></div><input type="range" id="sD" min="0.1" max="3" step="0.1" value="${SIM.d}"></div>
      <p class="lbl" style="margin-bottom:6px">Material do leito</p>
      <div class="seg" role="group" aria-label="Material">${Object.entries(BEDMAT).map(([k, v]) => `<button data-act="bedmat" data-arg="${k}" aria-pressed="${SIM.mat === k}">${v.n}</button>`).join('')}</div>
      <p style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="regime" id="regime">Leito fixo</span>${pauseBtn()}</p>
      <div class="kv"><div><small>u<sub>mf</sub> mínima fluidização</small><b id="kUmf">–</b></div><div><small>u<sub>t</sub> velocidade terminal</small><b id="kUt">–</b></div><div><small>ΔP do leito (30 cm)</small><b id="kDp">–</b></div></div>
      <canvas id="dpCanvas" width="340" height="190" style="width:100%;max-width:520px;height:auto;display:block" aria-label="Gráfico de queda de pressão versus velocidade"></canvas>
      <h3 style="font-size:1.15rem;margin:14px 0 8px">Missões (+15 XP cada)</h3>
      <ul class="missions" id="missions">${MISSIONS.map(([k, t]) => `<li class="${m[k] ? 'done' : ''}" data-m="${k}"><i>${m[k] ? '✓' : ''}</i>${t}</li>`).join('')}</ul>
      <p class="note" style="margin-top:12px">u<sub>mf</sub> pela correlação de Wen &amp; Yu (1966) e u<sub>t</sub> pelo arrasto de Schiller-Naumann, com ar a 20 °C e partículas consideradas esféricas. A animação é ilustrativa; os números são calculados.</p>
    </section>
  </div>
  <div class="learn-cta"><button class="btn ghost" data-act="tab" data-arg="cfd">Túnel de vento CFD →</button><button class="btn" data-act="tab" data-arg="jogar">Fazer o desafio final →</button></div>`;
}

function setupCanvas(cv, w, h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  if(!cv.style.width) cv.style.width = w + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx;
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; }

function initLeito(){
  const cv = $('#bedCanvas'); if(!cv) return;
  const W = 320, H = 460; const ctx = setupCanvas(cv, W, H);
  cv.style.maxWidth = '100%'; cv.style.height = 'auto';
  const dc = $('#dpCanvas'); const dctx = setupCanvas(dc, 340, 190); dc.style.width = '100%';
  const floor = 428, left = 24, right = W - 24, r = 5;
  const parts = [];
  for(let row = 0; row < 11; row++){
    for(let x = left + r + (row % 2 ? r : 0); x <= right - r; x += 2 * r){
      const y = floor - r - row * (2 * r * 0.87);
      parts.push({x, y, hx:x, hy:y, vx:0, vy:0});
    }
  }
  const topHome = floor - 11 * 2 * r * 0.87;
  const bubbles = []; const air = Array.from({length:46}, () => ({x:left + Math.random() * (right - left), y:Math.random() * floor}));
  let F = fluidCalc(SIM.d, BEDMAT[SIM.mat].rho);

  function update(){
    F = fluidCalc(SIM.d, BEDMAT[SIM.mat].rho);
    const u = sliderToU(SIM.s);
    const reg = regimeOf(u, F);
    $('#uVal').textContent = fmt(u, 2) + ' m/s';
    $('#dVal').textContent = fmt(SIM.d, 1) + ' mm';
    $('#kUmf').textContent = fmt(F.umf, 2) + ' m/s';
    $('#kUt').textContent = fmt(F.ut, 2) + ' m/s';
    const dp = u < F.umf ? F.dPb * u / F.umf : u < F.ut ? F.dPb : F.dPb * 0.15;
    $('#kDp').textContent = fmt(dp / 1000, 2) + ' kPa';
    const rg = $('#regime'); rg.textContent = REG[reg].n; rg.style.setProperty('--rc', REG[reg].c);
    drawDP(u);
    // missões
    const us = cur(); us.missions = us.missions || {};
    const key = reg === 'fixo' ? (u > 0.005 ? 'fixo' : null) : reg;
    if(key && !us.missions[key]){
      const bB = badgesOf(us).filter(b => b.on).length;
      us.missions[key] = true; save(); markDirty(us); beep('ok');
      const li = document.querySelector('#missions [data-m="' + key + '"]'); if(li){ li.classList.add('done'); li.firstElementChild.textContent = '✓'; }
      toast('Missão cumprida: +15 XP');
      if(badgesOf(us).filter(b => b.on).length > bB){ confetti(); toast('Nova conquista: Exploração do Leito 🧪'); }
      const chip = document.querySelector('.chip .mono'); if(chip) chip.textContent = xpOf(us) + ' XP';
    }
  }
  function drawDP(u){
    const w = 340, h = 190, pl = 44, pr = 12, pt = 14, pb = 34;
    const ink = cssVar('--ink'), mu = cssVar('--muted'), ln = cssVar('--line'), br = cssVar('--sky'), fl = cssVar('--flame');
    dctx.clearRect(0, 0, w, h);
    const umax = Math.min(12, Math.max(F.ut * 1.25, F.umf * 3));
    const X = v => pl + v / umax * (w - pl - pr), Y = p => h - pb - p / (F.dPb * 1.2) * (h - pt - pb);
    dctx.strokeStyle = ln; dctx.lineWidth = 1;
    for(let i = 0; i <= 4; i++){ const y = pt + i * (h - pt - pb) / 4; dctx.beginPath(); dctx.moveTo(pl, y); dctx.lineTo(w - pr, y); dctx.stroke(); }
    dctx.fillStyle = mu; dctx.font = '700 10px Nunito, system-ui, sans-serif';
    dctx.textAlign = 'right';
    [0, .5, 1].forEach(t => { const p = F.dPb * 1.2 * t; dctx.fillText(fmt(p / 1000, 1), pl - 6, Y(p) + 3); });
    dctx.save(); dctx.translate(11, (h - pb + pt) / 2); dctx.rotate(-Math.PI / 2); dctx.textAlign = 'center'; dctx.fillText('ΔP (kPa)', 0, 0); dctx.restore();
    dctx.textAlign = 'center'; dctx.fillText('velocidade do ar (m/s)', (pl + w - pr) / 2, h - 4);
    [0, umax / 2, umax].forEach(v => dctx.fillText(fmt(v, 1), X(v), h - pb + 13));
    dctx.strokeStyle = br; dctx.lineWidth = 3; dctx.beginPath(); dctx.moveTo(X(0), Y(0)); dctx.lineTo(X(F.umf), Y(F.dPb)); dctx.lineTo(X(Math.min(F.ut, umax)), Y(F.dPb)); dctx.stroke();
    if(F.ut < umax){ dctx.setLineDash([5, 4]); dctx.beginPath(); dctx.moveTo(X(F.ut), Y(F.dPb)); dctx.lineTo(X(Math.min(umax, F.ut * 1.15)), Y(F.dPb * .15)); dctx.lineTo(X(umax), Y(F.dPb * .15)); dctx.stroke(); dctx.setLineDash([]); }
    dctx.fillStyle = ink; dctx.font = '800 10px Nunito, system-ui, sans-serif';
    dctx.fillText('umf', X(F.umf), Y(F.dPb) - 8);
    if(F.ut < umax) dctx.fillText('ut', X(F.ut), Y(F.dPb) - 8);
    const dp = u < F.umf ? F.dPb * u / F.umf : u < F.ut ? F.dPb : F.dPb * 0.15;
    const ux = Math.min(u, umax);
    dctx.fillStyle = fl; dctx.beginPath(); dctx.arc(X(ux), Y(dp), 6, 0, Math.PI * 2); dctx.fill();
    dctx.strokeStyle = cssVar('--surface'); dctx.lineWidth = 2; dctx.stroke();
  }

  function frame(){
    if(SIM.paused){ SIM.raf = requestAnimationFrame(frame); return; }
    const u = sliderToU(SIM.s); const reg = regimeOf(u, F);
    const fb = reg === 'borb' ? clamp((u - F.umf) / (Math.min(F.ut, F.umf * 8) - F.umf), 0, 1) : 0;
    const E = 1 + 1.5 * Math.sqrt(fb);
    const top = floor - (floor - topHome) * E;
    // partículas
    for(const p of parts){
      if(reg === 'fixo'){ p.x += (p.hx - p.x) * 0.08; p.y += (p.hy - p.y) * 0.08; p.vx = p.vy = 0; }
      else if(reg === 'borb'){
        const a = 0.5 + 2.4 * fb;
        const ty = floor - (floor - p.hy) * E;
        p.vx += (Math.random() - .5) * a; p.vy += (Math.random() - .5) * a + (ty - p.y) * 0.015;
        p.vx *= .88; p.vy *= .88; p.x += p.vx; p.y += p.vy;
        if(p.y < top) { p.y = top; p.vy = Math.abs(p.vy); }
      } else {
        const sp = 1.6 + 4 * Math.min(1, (u - F.ut) / F.ut);
        p.vy = -sp * (0.7 + Math.random() * 0.6); p.vx += (Math.random() - .5) * 1.2; p.vx *= .9;
        p.x += p.vx; p.y += p.vy;
        if(p.y < 18){ p.y = floor - Math.random() * 30; p.x = left + Math.random() * (right - left); }
      }
      if(p.x < left + r){ p.x = left + r; p.vx = Math.abs(p.vx); }
      if(p.x > right - r){ p.x = right - r; p.vx = -Math.abs(p.vx); }
      if(p.y > floor - r){ p.y = floor - r; p.vy = -Math.abs(p.vy) * .5; }
    }
    // bolhas
    if(reg === 'borb' && Math.random() < 0.04 + 0.22 * fb) bubbles.push({x:left + 20 + Math.random() * (right - left - 40), y:floor - 6, r:4, rmax:8 + 26 * fb, sp:1 + 2.4 * fb});
    for(let i = bubbles.length - 1; i >= 0; i--){
      const b = bubbles[i]; b.y -= b.sp; b.r = Math.min(b.rmax, b.r + 0.3);
      for(const p of parts){ const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy); if(d < b.r + r && d > 0.01){ const k = (b.r + r) / d; p.x = b.x + dx * k; p.y = b.y + dy * k; p.vy -= 0.15; } }
      if(b.y - b.r < top || reg !== 'borb'){ bubbles.splice(i, 1); }
    }
    // desenho
    ctx.fillStyle = '#0B1E2E'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#10293D'; ctx.fillRect(left, 0, right - left, floor);
    // ar
    if(u > 0.005){
      ctx.strokeStyle = 'rgba(140,200,255,.35)'; ctx.lineWidth = 2;
      const v = Math.min(9, 0.6 + u * 1.6);
      for(const a of air){ a.y -= v; if(a.y < 0) { a.y = floor; a.x = left + Math.random() * (right - left); } ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, a.y + 6 + v); ctx.stroke(); }
    }
    for(const b of bubbles){ ctx.fillStyle = 'rgba(16,41,61,.9)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(160,220,255,.45)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.fillStyle = BEDMAT[SIM.mat].c;
    for(const p of parts){ ctx.beginPath(); ctx.arc(p.x, p.y, r - .4, 0, Math.PI * 2); ctx.fill(); }
    // paredes e distribuidor
    ctx.fillStyle = '#4A6577'; ctx.fillRect(left - 6, 0, 6, floor + 8); ctx.fillRect(right, 0, 6, floor + 8);
    ctx.fillStyle = '#8FA7B5'; ctx.fillRect(left - 6, floor, right - left + 12, 6);
    ctx.fillStyle = '#0B1E2E'; for(let x = left + 6; x < right; x += 12) ctx.fillRect(x, floor + 1, 4, 4);
    ctx.fillStyle = '#A9C6D8'; ctx.font = '800 11px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ar ↑ (distribuidor)', W / 2, floor + 22);
    if(reg === 'arraste'){ ctx.fillStyle = '#FFB01F'; ctx.fillText('↑ partículas indo para o ciclone ↑', W / 2, 12); }
    if(reg === 'borb' && !reduceMotion){ ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillText('bolhas de ar', W / 2, Math.max(28, top - 10)); }
    SIM.raf = requestAnimationFrame(frame);
  }
  $('#sU').addEventListener('input', e => { SIM.s = +e.target.value; update(); });
  $('#sD').addEventListener('input', e => { SIM.d = +e.target.value; update(); });
  update();
  SIM.raf = requestAnimationFrame(frame);
}

/* ---------- túnel de vento CFD (fluidos estáveis, Stam 1999) ---------- */
const CFD = {NX:96, NY:48, U:0.9, shape:'cilindro', mode:'fumaca', grid:false, vec:false, erase:false};
function viewCFD(){
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-act="cfd" data-k="${key}" data-arg="${v}" aria-pressed="${CFD[key] === v}">${l}</button>`).join('')}</div>`;
  return `<div class="watt">${WATT}<p class="bubble">Este é um mini-CFD de verdade: a cada quadro o computador resolve as equações do escoamento em ${CFD.NX} × ${CFD.NY} = ${CFD.NX * CFD.NY} células. Desenhe obstáculos com o dedo ou com o mouse!</p></div>
  <section class="card cfdbox">
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:end">
      <div style="min-width:0"><p class="lbl" style="margin-bottom:6px">Obstáculo</p>${seg('shape', [['cilindro','Cilindro'],['placa','Partícula plana'],['leito','Leito de partículas'],['livre','Livre (desenhe)']])}</div>
      <div style="min-width:0"><p class="lbl" style="margin-bottom:6px">Visualizar</p>${seg('mode', [['fumaca','Fumaça'],['vel','Velocidade'],['pres','Pressão']])}</div>
    </div>
    <div class="cfd-wrap"><canvas id="cfdCanvas" class="simcanvas" width="576" height="288" aria-label="Simulação de escoamento em túnel de vento"></canvas></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div class="slider" style="flex:1 1 260px;margin:0"><div class="top-row"><label for="cU">💨 Velocidade de entrada</label><span class="mono" id="cUv">${fmt(CFD.U, 2)}</span></div><input type="range" id="cU" min="0.2" max="1.6" step="0.05" value="${CFD.U}"></div>
      <div class="checks"><label><input type="checkbox" id="cGrid" ${CFD.grid ? 'checked' : ''}> Mostrar malha</label><label><input type="checkbox" id="cVec" ${CFD.vec ? 'checked' : ''}> Vetores</label><label><input type="checkbox" id="cErase" ${CFD.erase ? 'checked' : ''}> Borracha</label></div>
      <span style="display:flex;gap:10px;align-items:center">${pauseBtn()}<span class="mono muted" id="cIt">iteração 0</span></span>
    </div>
    <ol class="steps">
      <li><b>Geometria:</b> o obstáculo que você escolheu ou desenhou.</li>
      <li><b>Malha:</b> ${CFD.NX * CFD.NY} células quadradas. Ligue “Mostrar malha”.</li>
      <li><b>Física:</b> fluido incompressível, conservando massa e quantidade de movimento.</li>
      <li><b>Contorno:</b> ar entra pela esquerda, sai pela direita; paredes em cima e embaixo.</li>
      <li><b>Solução:</b> a cada quadro, advecção + 30 iterações de pressão.</li>
      <li><b>Pós-processamento:</b> cores de fumaça, velocidade ou pressão.</li>
    </ol>
    <p class="note">Método de “fluidos estáveis” (Stam, 1999), simplificado para rodar no navegador. Programas como OpenFOAM e MFiX usam os mesmos princípios com muito mais células e física.</p>
  </section>
  <div class="learn-cta"><button class="btn ghost" data-act="tab" data-arg="leito">← Simulador de leito</button><button class="btn" data-act="tab" data-arg="jogar">Fazer o desafio final →</button></div>`;
}

function initCFD(){
  const cv = $('#cfdCanvas'); if(!cv) return;
  const NX = CFD.NX, NY = CFD.NY, N = NX * NY, S = 6;
  const ctx = cv.getContext('2d');
  const off = document.createElement('canvas'); off.width = NX; off.height = NY; const octx = off.getContext('2d'); const img = octx.createImageData(NX, NY);
  let u = new Float32Array(N), v = new Float32Array(N), u0 = new Float32Array(N), v0 = new Float32Array(N);
  let p = new Float32Array(N), p2 = new Float32Array(N), div = new Float32Array(N), dye = new Float32Array(N), dye0 = new Float32Array(N);
  const solid = new Uint8Array(N);
  let it = 0;
  const id = (i, j) => i + j * NX;
  function setShape(){
    solid.fill(0);
    const cyl = (cx, cy, rr) => { for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++) if((i - cx) ** 2 + (j - cy) ** 2 <= rr * rr) solid[id(i, j)] = 1; };
    if(CFD.shape === 'cilindro') cyl(24, NY / 2 + 0.5, 6);
    else if(CFD.shape === 'placa'){ for(let t = 0; t <= 1; t += 0.01){ const x = 20 + t * 9, y = 15 + t * 18; cyl(x, y, 1.3); } }
    else if(CFD.shape === 'leito'){ for(let c = 0; c < 4; c++) for(let rI = 0; rI < 5; rI++){ cyl(18 + c * 7, 7 + rI * 8.5 + (c % 2 ? 4 : 0), 2.4); } }
    for(let k = 0; k < N; k++) if(solid[k]){ u[k] = v[k] = dye[k] = 0; }
  }
  setShape();
  for(let k = 0; k < N; k++) if(!solid[k]) u[k] = CFD.U;
  function advect(dst, src){
    for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
      const k = i + j * NX; if(solid[k]){ dst[k] = 0; continue; }
      let x = i - u[k], y = j - v[k];
      x = clamp(x, 0, NX - 1.001); y = clamp(y, 0, NY - 1.001);
      const i0 = x | 0, j0 = y | 0, sx = x - i0, sy = y - j0, k0 = i0 + j0 * NX;
      dst[k] = (1 - sx) * ((1 - sy) * src[k0] + sy * src[k0 + NX]) + sx * ((1 - sy) * src[k0 + 1] + sy * src[k0 + 1 + NX]);
    }
  }
  function bounds(){
    for(let j = 0; j < NY; j++){
      const k = id(0, j); if(!solid[k]){ u[k] = CFD.U; v[k] = 0; }
      dye[k] = (j % 6 < 2) ? 1 : 0;
      const kr = id(NX - 1, j); u[kr] = u[kr - 1]; v[kr] = v[kr - 1];
    }
    for(let i = 0; i < NX; i++){ v[id(i, 0)] = 0; v[id(i, NY - 1)] = 0; }
  }
  function project(){
    for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
      const k = i + j * NX; if(solid[k]){ div[k] = 0; p[k] = 0; continue; }
      const uR = i < NX - 1 ? (solid[k + 1] ? 0 : u[k + 1]) : u[k];
      const uL = i > 0 ? (solid[k - 1] ? 0 : u[k - 1]) : u[k];
      const vD = j < NY - 1 ? (solid[k + NX] ? 0 : v[k + NX]) : 0;
      const vU = j > 0 ? (solid[k - NX] ? 0 : v[k - NX]) : 0;
      div[k] = -0.5 * (uR - uL + vD - vU);
    }
    for(let n = 0; n < 30; n++){
      for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
        const k = i + j * NX; if(solid[k]){ p2[k] = 0; continue; }
        const pc = p[k];
        const pL = i > 0 && !solid[k - 1] ? p[k - 1] : pc;
        const pR = i < NX - 1 ? (solid[k + 1] ? pc : p[k + 1]) : 0;
        const pU = j > 0 && !solid[k - NX] ? p[k - NX] : pc;
        const pD = j < NY - 1 && !solid[k + NX] ? p[k + NX] : pc;
        p2[k] = (div[k] + pL + pR + pU + pD) / 4;
      }
      const t = p; p = p2; p2 = t;
    }
    for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
      const k = i + j * NX; if(solid[k]) continue;
      const pc = p[k];
      const pL = i > 0 && !solid[k - 1] ? p[k - 1] : pc;
      const pR = i < NX - 1 ? (solid[k + 1] ? pc : p[k + 1]) : 0;
      const pU = j > 0 && !solid[k - NX] ? p[k - NX] : pc;
      const pD = j < NY - 1 && !solid[k + NX] ? p[k + NX] : pc;
      u[k] -= 0.5 * (pR - pL); v[k] -= 0.5 * (pD - pU);
    }
  }
  function step(){
    bounds();
    advect(u0, u); advect(v0, v);
    let t = u; u = u0; u0 = t; t = v; v = v0; v0 = t;
    advect(dye0, dye); t = dye; dye = dye0; dye0 = t;
    for(let k = 0; k < N; k++) dye[k] *= 0.999;
    for(let j = 2; j < NY - 2; j++){ const k = id(34, j); if(!solid[k]) v[k] += (Math.random() - .5) * 0.02; }
    project(); bounds(); it++;
  }
  const STOPS = [[20,40,110],[30,130,220],[40,210,160],[255,210,60],[240,80,50]];
  function cmap(t){ t = clamp(t, 0, 1) * (STOPS.length - 1); const i = Math.min(STOPS.length - 2, t | 0), f = t - i, a = STOPS[i], b = STOPS[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
  function draw(){
    const d = img.data; let pmax = 1e-6;
    if(CFD.mode === 'pres') for(let k = 0; k < N; k++) if(!solid[k]) pmax = Math.max(pmax, Math.abs(p[k]));
    for(let k = 0; k < N; k++){
      let c;
      if(solid[k]) c = [190, 200, 210];
      else if(CFD.mode === 'fumaca'){ const s = clamp(dye[k], 0, 1); c = [11 + s * 244, 30 + s * 196, 46 + s * 120]; }
      else if(CFD.mode === 'vel'){ c = cmap(Math.hypot(u[k], v[k]) / (CFD.U * 1.8)); }
      else { const s = clamp(p[k] / pmax, -1, 1); c = s > 0 ? [255, 255 - 190 * s, 255 - 210 * s] : [255 + 215 * s, 255 + 140 * s, 255]; }
      d[k * 4] = c[0]; d[k * 4 + 1] = c[1]; d[k * 4 + 2] = c[2]; d[k * 4 + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, 0, NX * S, NY * S);
    if(CFD.grid){ ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1; ctx.beginPath(); for(let i = 0; i <= NX; i++){ ctx.moveTo(i * S + .5, 0); ctx.lineTo(i * S + .5, NY * S); } for(let j = 0; j <= NY; j++){ ctx.moveTo(0, j * S + .5); ctx.lineTo(NX * S, j * S + .5); } ctx.stroke(); }
    if(CFD.vec){ ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; ctx.beginPath(); for(let j = 2; j < NY; j += 4) for(let i = 2; i < NX; i += 4){ const k = id(i, j); if(solid[k]) continue; const x = i * S + S / 2, y = j * S + S / 2, sc = 9 / Math.max(CFD.U, .2); const ex = x + u[k] * sc, ey = y + v[k] * sc; ctx.moveTo(x, y); ctx.lineTo(ex, ey); const a = Math.atan2(ey - y, ex - x); ctx.moveTo(ex, ey); ctx.lineTo(ex - 3 * Math.cos(a - .5), ey - 3 * Math.sin(a - .5)); ctx.moveTo(ex, ey); ctx.lineTo(ex - 3 * Math.cos(a + .5), ey - 3 * Math.sin(a + .5)); } ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '800 12px Nunito, system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('entrada de ar →', 8, 16); ctx.textAlign = 'right'; ctx.fillText('→ saída', NX * S - 8, 16);
    const ci = $('#cIt'); if(ci) ci.textContent = 'iteração ' + it.toLocaleString('pt-BR');
  }
  function loop(){ if(!SIM.paused){ step(); step(); } draw(); SIM.cfdRaf = requestAnimationFrame(loop); }
  // desenhar obstáculos
  let drawing = false;
  function paint(e){
    const rc = cv.getBoundingClientRect();
    const gi = (e.clientX - rc.left) / rc.width * NX, gj = (e.clientY - rc.top) / rc.height * NY;
    for(let j = Math.floor(gj - 2); j <= gj + 2; j++) for(let i = Math.floor(gi - 2); i <= gi + 2; i++){
      if(i < 2 || i >= NX - 1 || j < 0 || j >= NY) continue;
      if((i - gi) ** 2 + (j - gj) ** 2 > 4) continue;
      const k = id(i, j); solid[k] = CFD.erase ? 0 : 1; if(!CFD.erase){ u[k] = v[k] = dye[k] = 0; }
    }
  }
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); paint(e); });
  cv.addEventListener('pointermove', e => { if(drawing) paint(e); });
  cv.addEventListener('pointerup', () => drawing = false);
  cv.addEventListener('pointercancel', () => drawing = false);
  $('#cU').addEventListener('input', e => { CFD.U = +e.target.value; $('#cUv').textContent = fmt(CFD.U, 2); });
  $('#cGrid').addEventListener('change', e => { CFD.grid = e.target.checked; draw(); });
  $('#cVec').addEventListener('change', e => { CFD.vec = e.target.checked; draw(); });
  $('#cErase').addEventListener('change', e => { CFD.erase = e.target.checked; });
  SIM.cfdApi = {setShape: () => { setShape(); draw(); }, draw};
  SIM.cfdRaf = requestAnimationFrame(loop);
}

function stopSims(){ cancelAnimationFrame(SIM.raf); cancelAnimationFrame(SIM.cfdRaf); SIM.cfdApi = null; }

function mergeUsers(inc){
  let n = 0;
  Object.values(inc || {}).forEach(x => {
    if(!x || !x.id || !x.name) return;
    const y = store.users[x.id];
    if(!y){ store.users[x.id] = {id:x.id, name:String(x.name).slice(0, 40), turma:String(x.turma || '').slice(0, 24), avatar:AVATARS.includes(x.avatar) ? x.avatar : AVATARS[0], phases:x.phases || {}, missions:x.missions || {}, seen:x.seen || {}, errors:x.errors || {}, created:x.created || Date.now(), last:x.last || 0}; n++; return; }
    Object.entries(x.phases || {}).forEach(([k, p]) => { const q = y.phases[k]; if(!q || (p.xp || 0) > (q.xp || 0) || (p.best || 0) > (q.best || 0)) y.phases[k] = {xp:Math.max(p.xp || 0, q ? q.xp : 0), stars:Math.max(p.stars || 0, q ? q.stars : 0), best:Math.max(p.best || 0, q ? q.best : 0), attempts:Math.max(p.attempts || 0, q ? q.attempts : 0), last:p.last, at:p.at}; });
    y.missions = y.missions || {}; Object.entries(x.missions || {}).forEach(([k, v]) => { if(v) y.missions[k] = true; });
    ['seen', 'errors'].forEach(f => { y[f] = y[f] || {}; Object.entries(x[f] || {}).forEach(([k, v]) => y[f][k] = Math.max(y[f][k] || 0, v)); });
    y.last = Math.max(y.last || 0, x.last || 0); n++;
  });
  return n;
}

/* ---------- sobre e certificado ---------- */
function viewAbout(){

    <div class="two">
      <section class="card"><h3>O projeto</h3><p>A finalidade principal do projeto é fazer uma <b>análise crítica sobre o uso e o consumo de materiais</b> e sobre o que eles ainda podem render: na reciclagem, em outras rotas de aproveitamento e na produção de energia.</p><p style="margin-top:8px">Partindo dessa análise, o projeto discute <b>como transformar resíduos em energia</b> e usa esse tema para promover a <b>educação científica</b> de estudantes do ensino médio. O foco de estudo são as embalagens cartonadas (Tetra Pak), um material comum no dia a dia e difícil de reciclar.</p><p style="margin-top:8px">A simulação computacional e o reator de leito fluidizado entram como <b>contexto e exemplo</b>. São um dos caminhos possíveis para aproveitar resíduos, não o único.</p></section>
      <section class="card"><h3>Ficha</h3><ul><li><b>Instituição executora:</b> UNIVC, Centro Universitário Vale do Cricaré</li><li><b>Município:</b> São Mateus (ES)</li><li><b>Duração:</b> 10 meses, início previsto em março de 2026</li><li><b>Escola parceira:</b> EEEFM Marita Motta Santos</li><li><b>Coordenação:</b> Estevão Luiz de Oliveira Gonçalves</li><li><b>Tutoria:</b> Francisnay Ribeiro da Silva</li><li><b>Pesquisador colaborador:</b> Felipe Oliveira Souza</li><li><b>Bolsistas ICJr:</b> equipe de estudantes do ensino médio</li></ul></section>
    </div>
    <div class="two">
      <section class="card"><h3>Eixos do projeto</h3><ol><li><b>Consumo e materiais:</b> o que consumimos, do que é feito e quanto descartamos.</li><li><b>Destinação adequada:</b> reduzir, reutilizar e reciclar vêm antes de qualquer outra rota.</li><li><b>Rotas de aproveitamento:</b> compostagem, biodigestão, pirólise, gaseificação, incineração e outras, com vantagens e limites de cada uma.</li><li><b>Produtos energéticos:</b> biogás, gás de síntese, bio-óleo, biodiesel, calor e eletricidade.</li><li><b>Simulação e leito fluidizado:</b> ferramentas para visualizar e entender os fenômenos, apresentadas de forma introdutória.</li><li><b>Educação científica:</b> levar essa discussão para a escola e a comunidade.</li></ol></section>
      <section class="card"><h3>O papel da simulação computacional</h3><p>A simulação aparece no projeto como uma <b>introdução</b>, para mostrar o que ela é e para que serve. Os estudantes veem demonstrações e exploram modelos simplificados, como os deste jogo, para entender ideias como escoamento, malha e regimes de fluidização.</p><p style="margin-top:8px">O objetivo <b>não</b> é que os estudantes operem softwares avançados de simulação. Essas ferramentas exigem formação específica e, muitas vezes, licenças pagas. O que importa é a compreensão do fenômeno e o pensamento crítico sobre ele.</p></section>

  </main>`;

function viewCert(){
  const u = cur(); const xp = xpOf(u); const all = PHASES.every(p => done(u, p.id));
  if(!all) return `<main class="about wrap"><section class="card"><h2>Quase lá!</h2><p style="margin-top:8px">Conclua as 6 fases para liberar o certificado.</p><p style="margin-top:12px"><button class="btn" data-act="go" data-arg="hub">Voltar ao mapa</button></p></section></main>`;
  const stars = PHASES.reduce((s, p) => s + (u.phases[p.id].stars || 0), 0);
  return `<main class="wrap"><section class="cert">
    ${WATT}
    <p class="eyebrow">Certificado de conclusão</p>

    <p class="who">${u.avatar} ${esc(u.name)}</p>
    <p>da turma <b>${esc(u.turma)}</b> completou a jornada sobre resíduos sólidos, conversão energética e fluidodinâmica computacional, com <b>${xp} XP</b> e <b>${stars} de 18 estrelas</b>, alcançando o nível <b>${levelOf(xp).name}</b>.</p>
    <p class="muted" style="font-size:.9rem">Projeto PICJr 2026 · UNIVC · São Mateus (ES) · ${new Date().toLocaleDateString('pt-BR')}</p>
    <p class="note">Tire um print desta tela para guardar.</p>
    <button class="btn ghost" data-act="go" data-arg="hub">Voltar ao mapa</button>
  </section></main>`;
}

/* ---------- pós-renderização ---------- */
function afterRender(){
  const lf = $('#loginForm');
  if(lf){
    lf.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#lgName').value.trim().replace(/\s+/g, ' '), turma = $('#lgTurma').value.trim().replace(/\s+/g, ' ');
      if(name.length < 2){ $('#lgErr').textContent = 'Escreva seu nome (pelo menos 2 letras).'; $('#lgName').focus(); return; }
      if(!turma){ $('#lgErr').textContent = 'Escreva sua turma, por exemplo “1º ano A”.'; $('#lgTurma').focus(); return; }
      const id = slug(name) + '|' + slug(turma);
      let u = store.users[id];
      if(!u){ u = store.users[id] = {id, name, turma, avatar:state.avatar, phases:{}, missions:{}, seen:{}, errors:{}, created:Date.now()}; }
      else u.avatar = state.avatar;
      u.last = Date.now(); store.currentId = id; save(); markDirty(u);
      state.screen = 'hub'; render(); window.scrollTo({top:0});
    });
  }
  const pf = $('#pinForm');
  if(pf){
    pf.addEventListener('submit', e => {
      e.preventDefault(); const v = $('#pinIn').value;
      if(!store.pin){ if(v.length < 4){ $('#pinErr').textContent = 'Use pelo menos 4 caracteres.'; return; } store.pin = v; save(); }
      else if(v !== store.pin){ $('#pinErr').textContent = 'Senha incorreta. Tente de novo.'; $('#pinIn').select(); return; }
      state.teacherOk = true; state.screen = 'teacher'; render();
    });
    $('#pinIn').focus();
  }
  const np = $('#newPin');
  if(np) np.addEventListener('submit', e => { e.preventDefault(); const v = $('#np').value; if(v.length < 4){ toast('A senha precisa de pelo menos 4 caracteres.'); return; } store.pin = v; save(); $('#np').value = ''; toast('Senha do painel atualizada.'); });
  const sf = $('#shForm');
  if(sf){
    updateSheetsStatus();
    sf.addEventListener('submit', async e => {
      e.preventDefault();
      const url = $('#shUrl').value.trim(), key = $('#shKey').value.trim();
      if(url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)){ toast('A URL precisa começar com https://script.google.com e terminar em /exec.'); return; }
      store.sheetsUrl = url === SHEETS_URL_PADRAO ? '' : url; store.sheetsKey = key; save();
      if(!sheetsUrl()){ updateSheetsStatus(); toast('Planilha desligada neste navegador.'); return; }
      try{ const j = await postSheets({acao:'testar', chave:key}); toast(j.ok ? (j.chave ? 'Conectado! A chave está certa.' : 'Conectado, mas a chave do(a) professor(a) não confere.') : 'A planilha respondeu: ' + (j.erro || 'erro')); flushSheets(); }
      catch(err){ toast('Não consegui falar com a planilha. Confira a URL e se a implantação permite “Qualquer pessoa”.'); }
      updateSheetsStatus();
    });
  }
  const tf = $('#tFilter'); if(tf) tf.addEventListener('change', e => { state.turma = e.target.value; render(); });
  const ts = $('#tSound'); if(ts) ts.addEventListener('change', e => { store.sound = e.target.checked; save(); });
  if($('#calcOut')){
    document.querySelectorAll('[data-calc]').forEach(inp => inp.addEventListener('input', e => { const k = e.target.dataset.calc; CALC[k] = +e.target.value; $('#v_' + k).textContent = fmt(CALC[k]) + ' ' + e.target.dataset.unit; calcUpdate(); }));
    calcUpdate();
  }
  if($('#bedCanvas')) initLeito();
  if($('#cfdCanvas')) initCFD();
}

/* ---------- ações ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if(act !== 'deluser' && act !== 'resetall') state.confirm = null;
  switch(act){
    case 'go':
      if(arg === 'teacher'){ state.screen = state.teacherOk ? 'teacher' : 'pin'; }
      else if((arg === 'hub' || arg === 'cert') && !cur()) state.screen = 'login';
      else state.screen = arg;
      render(); window.scrollTo({top:0}); break;
    case 'pick-ava':
      state.avatar = arg; document.querySelectorAll('.ava-pick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.arg === arg)); break;
    case 'quick': {
      const u = store.users[arg]; if(!u) return; u.last = Date.now(); store.currentId = arg; save(); markDirty(u); state.screen = 'hub'; render(); window.scrollTo({top:0}); break; }
    case 'logout': store.currentId = null; save(); run = null; state.screen = 'login'; render(); break;
    case 'sound': store.sound = !store.sound; save(); render(); break;
    case 'open': {
      const id = +arg; if(!PHASES[id - 1]) return;
      state.phase = id; state.tab = 'aprender'; run = null; state.screen = 'phase'; render(); window.scrollTo({top:0}); break; }
    case 'tab':
      if(arg === 'jogar' && (!run || run.pid !== state.phase || run.result)) startRun(state.phase);
      state.tab = arg; render(); break;
    case 'answer': answer(arg); break;
    case 'pause':
      SIM.paused = !SIM.paused;
      document.querySelectorAll('[data-act="pause"]').forEach(b => { b.setAttribute('aria-pressed', SIM.paused); b.textContent = SIM.paused ? '▶ Continuar animação' : '⏸ Pausar animação'; });
      break;
    case 'next': nextQ(); break;
    case 'restart': startRun(state.phase); render(); window.scrollTo({top:0}); break;
    case 'bedmat': SIM.mat = arg; document.querySelectorAll('[data-act="bedmat"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.arg === arg)); { const s = $('#sU'); if(s) s.dispatchEvent(new Event('input')); } break;
    case 'cfd': {
      const k = el.dataset.k; CFD[k] = arg;
      document.querySelectorAll('[data-act="cfd"][data-k="' + k + '"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.arg === arg));
      if(k === 'shape' && SIM.cfdApi) SIM.cfdApi.setShape(); else if(SIM.cfdApi) SIM.cfdApi.draw();
      break; }
    case 'tlock': state.teacherOk = false; state.screen = cur() ? 'hub' : 'login'; render(); break;
    case 'deluser':
      if(state.confirm === 'del:' + arg){ delete store.users[arg]; if(store.currentId === arg) store.currentId = null; save(); state.confirm = null; toast('Estudante excluído.'); }
      else state.confirm = 'del:' + arg;
      render(); break;
    case 'resetall':
      if(state.confirm === 'reset'){ const keep = {pin:store.pin, sheetsUrl:store.sheetsUrl, sheetsKey:store.sheetsKey}; store = Object.assign(freshStore(), keep); save(); run = null; state.confirm = null; toast('Todos os dados foram apagados.'); }
      else state.confirm = 'reset';
      render(); break;
    case 'copyexp': {
      const ta = $('#exportTxt');
      const fallback = () => { ta.focus(); ta.select(); toast('Texto selecionado: use Ctrl+C para copiar.'); };
      try{ navigator.clipboard.writeText(ta.value).then(() => toast('Dados copiados.'), fallback); }catch(err){ fallback(); }
      break; }
    case 'dlexp': {
      try{ const blob = new Blob([$('#exportTxt').value], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'do-lixo-a-luz-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Se o download não começar, use “Copiar dados”.'); }catch(err){ toast('Download indisponível aqui: use “Copiar dados”.'); }
      break; }
    case 'sh-load': {
      if(!sheetsUrl()){ toast('Salve a URL da planilha primeiro.'); break; }
      postSheets({acao:'listar', chave:store.sheetsKey || ''}).then(j => {
        if(!j.ok){ toast(j.erro === 'chave' ? 'Chave do(a) professor(a) incorreta.' : 'A planilha respondeu: ' + j.erro); return; }
        const map = {}; (j.alunos || []).forEach(a => { if(a && a.id) map[a.id] = a; });
        const n = mergeUsers(map); save(); render(); toast(n + ' estudante(s) carregado(s) da planilha.');
      }).catch(() => toast('Não consegui falar com a planilha. Confira a internet e a URL.'));
      break; }
    case 'sh-pushall': {
      if(!sheetsUrl()){ toast('Salve a URL da planilha primeiro.'); break; }
      const us = Object.values(store.users);
      us.forEach(u => { store.outbox = store.outbox || {}; const o = store.outbox[u.id] || (store.outbox[u.id] = {fases:[]}); o.v = (o.v || 0) + 1; });
      save(); updateSheetsStatus(); flushSheets(); toast(us.length + ' estudante(s) na fila de envio.');
      break; }
    case 'import': {
      try{ const data = JSON.parse($('#importTxt').value); if(!data || data.app !== 'dolixoaluz') throw new Error('x'); const n = mergeUsers(data.users); save(); render(); toast(n + ' estudante(s) mesclado(s).'); }
      catch(err){ toast('Não reconheci esses dados. Cole o texto completo copiado do painel de outro computador.'); }
      break; }
  }
});

render();
flushSheets();
})();
</script>
